name: homeassistant

services:
  homeassistant:
    image: ${HA_IMAGE:?Set HA_IMAGE in .env to a pinned official release}
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host
    environment:
      TZ: Europe/Stockholm
    volumes:
      - type: bind
        source: /srv/appdata/homeassistant
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
